name: Оновити дані атестації

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: Download Excel from Firebase Storage
        env:
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FILE_PATH: ${{ secrets.FIREBASE_FILE_PATH }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python3 tools/fetch_excel.py

      - name: Generate data.js
        run: python3 tools/build_data.py "data/Атестація Літо 2026.xlsx"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Дані не змінились - нічого комітити."
            exit 0
          fi
          git commit -m "Оновити дані атестації (Firebase)"
          git push
