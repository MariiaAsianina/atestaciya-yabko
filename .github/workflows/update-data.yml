name: Оновити дані атестації

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Download Excel from Google Sheets
        run: |
          curl -sL "https://docs.google.com/spreadsheets/d/1_bxhv7d-ID9GqY5vYVgdknC1G8RJ4yike6ODDN_4KRY/export?format=xlsx" \
               -o "data/Атестація Літо 2026.xlsx"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate data.js
        run: |
          pip install --quiet openpyxl
          python3 tools/build_data.py "data/Атестація Літо 2026.xlsx"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Дані не змінились."
            exit 0
          fi
          git commit -m "Оновити дані атестації (Google Sheets)"
          git push
